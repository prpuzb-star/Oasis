<!DOCTYPE html>

<head>
<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--t:#1c1c1e;--s:rgba(60,60,67,.66);--g:rgba(255,255,255,.26);--gb:rgba(255,255,255,.55);--bub:rgba(255,255,255,.24);--me:linear-gradient(135deg,rgba(255,94,98,.66),rgba(139,92,246,.66));--b1:#ffd1dc;--b2:#c9b8ff;--b3:#a5e3ff;--sheet:rgba(255,255,255,.72);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--t:#f5f5f7;--s:rgba(235,235,245,.66);--g:rgba(40,40,60,.36);--gb:rgba(255,255,255,.18);--bub:rgba(60,60,90,.34);--b1:#4a1d4f;--b2:#1d2a5c;--b3:#0b3b4a;--sheet:rgba(30,30,48,.8);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--b1),var(--b2) 55%,var(--b3));color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;position:relative;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;display:none}
body.hasbg #bg{display:block}body.hasbg .orb{display:none}
.orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.7;z-index:0;pointer-events:none}
.o1{width:300px;height:300px;background:#ff7eb3;top:-80px;left:-80px}.o2{width:280px;height:280px;background:#7aa2ff;bottom:60px;right:-90px}.o3{width:220px;height:220px;background:#7af0d0;top:40%;left:30%;opacity:.45}
.glass{background:var(--g);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 30px rgba(0,0,0,.1)}
.hide{display:none!important}
button{font:inherit;color:inherit}
/* kirish */
#login{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:360px;padding:28px 22px;border-radius:32px;text-align:center}
.card .logo{width:84px;height:84px;margin-bottom:10px;border-radius:22px}
.card h1{margin:0 0 4px;font-size:30px}.card p{margin:0 0 18px;color:var(--s);font-size:14px}
.card input{width:100%;margin-bottom:10px;padding:14px 16px;border-radius:18px;border:1px solid var(--gb);background:var(--g);color:var(--t);font:inherit;font-size:16px;outline:0}
.card input::placeholder{color:var(--s)}
.card .go{width:100%;padding:14px;border:0;border-radius:18px;background:var(--me);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
#err{color:#ff453a;font-size:13px;min-height:18px;margin-top:10px}
/* ekranlar */
#app{position:relative;z-index:1;flex:1;min-height:0;overflow:hidden}
#home,#chat{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
#home{transition:transform .4s cubic-bezier(.22,1,.36,1),opacity .4s}
#chat{transform:translateX(104%);transition:transform .4s cubic-bezier(.22,1,.36,1);background:transparent}
#app.inchat #chat{transform:none}
#app.inchat #home{transform:translateX(-22%);opacity:.3;pointer-events:none}
header{position:relative;z-index:5;margin:10px 12px 0;padding:9px 12px;border-radius:28px;display:flex;align-items:center;gap:8px;flex:none}
.logo{width:42px;height:42px;flex:none;border-radius:12px}
header .nm{flex:1;min-width:0}header b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header small{color:var(--s);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--gb);background:var(--g);color:var(--t);font-size:18px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex:none;padding:0;transition:transform .2s cubic-bezier(.3,1.5,.5,1),opacity .2s}
.ib:active,.send:active,.cb:active{transform:scale(.86)}
.ib:disabled{opacity:.4}
.cav{width:42px;height:42px;border-radius:50%;background:var(--me);display:grid;place-items:center;font-size:21px;flex:none;color:#fff}
#menu{position:absolute;top:calc(100% + 8px);right:0;width:250px;border-radius:22px;padding:6px;display:flex;flex-direction:column;animation:scin .22s cubic-bezier(.3,1.4,.5,1);transform-origin:90% 0}
#menu button,.pa{background:none;border:0;color:var(--t);font-size:15px;text-align:left;padding:12px 14px;border-radius:16px;cursor:pointer}
#menu button:active,.pa:active{background:var(--g)}
@keyframes scin{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
#tabs{display:flex;gap:8px;padding:12px 14px 4px;overflow-x:auto;flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--gb);background:var(--g);white-space:nowrap;cursor:pointer;font-size:14px;transition:all .25s}
.tab.on{background:var(--me);color:#fff;border-color:transparent}
#chats{flex:1;overflow-y:auto;padding:8px 12px 16px;display:flex;flex-direction:column;gap:8px}
.ci{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:26px;cursor:pointer;animation:fup .45s cubic-bezier(.22,1,.36,1) both;user-select:none;-webkit-user-select:none}
.ci:active{transform:scale(.98)}
@keyframes fup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ci .mid{flex:1;min-width:0}.ci b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .pv{color:var(--s);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ci .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--s)}
.bd{min-width:22px;height:22px;border-radius:11px;background:var(--me);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 6px}
.kind{font-size:11px;opacity:.8;margin-left:6px}
.empty{margin:auto;text-align:center;color:var(--s);font-size:15px;padding:20px;line-height:1.5;white-space:pre-line}
/* xabarlar */
#list{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:3px;min-height:0}
.day{align-self:center;font-size:12px;color:var(--s);padding:4px 12px;border-radius:12px;background:var(--g);margin:8px 0}
.m{position:relative;max-width:82%;padding:8px 14px 5px;border-radius:22px;align-self:flex-start;overflow-wrap:anywhere;background:var(--bub);touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin-top:1px}
.m.me{align-self:flex-end;background:var(--me);color:#fff;border-color:rgba(255,255,255,.4)}
.m.me.tail{border-bottom-right-radius:6px;margin-bottom:5px}
.m:not(.me).tail{border-bottom-left-radius:6px;margin-bottom:5px}
.m.new{animation:bin .55s cubic-bezier(.2,1.3,.4,1) both;transform-origin:0 100%}
.m.me.new{transform-origin:100% 100%;--r:3deg}.m:not(.me).new{--r:-3deg}
@keyframes bin{0%{opacity:0;transform:translateY(36px) scale(.45) rotate(var(--r))}55%{opacity:1;transform:translateY(-5px) scale(1.05)}78%{transform:translateY(2px) scale(.985)}100%{transform:none}}
.m.flash{animation:fl 1.2s}
@keyframes fl{0%,100%{filter:none}30%{filter:brightness(1.5) saturate(1.4)}}
.t{white-space:pre-wrap;font-size:16px;line-height:1.32;user-select:text;-webkit-user-select:text}
.t.del{font-style:italic;opacity:.7}
.mi,.m video{display:block;width:100%;max-width:260px;max-height:320px;min-height:90px;object-fit:cover;border-radius:16px;margin:0 0 4px;cursor:zoom-in;background:rgba(0,0,0,.12)}
.m video{cursor:auto}
.ts{font-size:11px;color:var(--s);text-align:right;margin-top:1px;display:flex;justify-content:flex-end;gap:5px;align-items:center}
.m.me .ts{color:rgba(255,255,255,.85)}
.tk{letter-spacing:-3px;font-weight:700}.tk.rd{color:#7fe3ff}
.q{border-left:3px solid #ff7eb3;background:rgba(255,255,255,.16);border-radius:10px;padding:4px 9px;margin:0 0 5px;font-size:13px;cursor:pointer}
.qa{font-weight:600;font-size:12px}.qt{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 2px}
.rx span{font-size:13px;padding:2px 8px;border-radius:12px;background:rgba(255,255,255,.28);cursor:pointer;animation:scin .3s cubic-bezier(.3,1.6,.5,1)}
.rx span.mine{background:rgba(255,255,255,.55);color:#222}
.pe{width:22px;height:22px;vertical-align:-5px}.pf{display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) scale(1.12)}}
.t.big .pe{width:84px;height:84px}.t.big .pf{font-size:64px}
.vo{display:flex;align-items:center;gap:10px;min-width:210px;padding:2px 0 3px}
.vp{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.35);font-size:15px;cursor:pointer;flex:none}
.wv{display:flex;align-items:center;gap:2px;height:28px;flex:1;cursor:pointer}
.wv i{display:block;width:3px;border-radius:2px;background:currentColor;opacity:.35;transition:opacity .2s}
.wv i.on{opacity:1}
.vt{font-size:12px;min-width:34px;text-align:right}
/* yozish paneli */
#rbar{margin:4px 12px 0;padding:8px 12px;border-radius:20px;display:flex;align-items:center;gap:10px;animation:scin .2s}
#rbar .rb1{flex:1;min-width:0;border-left:3px solid #ff7eb3;padding-left:9px}
#rbar b{font-size:12px;display:block}#rbar span{font-size:13px;color:var(--s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#nope{margin:6px 12px 10px;padding:14px;border-radius:24px;text-align:center;color:var(--s);font-size:14px}
.bar{position:relative;z-index:2;margin:6px 12px 10px;padding:6px;border-radius:30px;display:flex;gap:6px;align-items:flex-end;flex:none}
textarea{flex:1;border:0;background:transparent;padding:11px 6px;font:inherit;font-size:16px;color:var(--t);resize:none;max-height:120px;outline:0;min-width:0}
textarea::placeholder{color:var(--s)}
.send{width:40px;height:40px;border:0;border-radius:50%;background:var(--me);color:#fff;font-size:18px;cursor:pointer;flex:none;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.send.pop{animation:spin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes spin{from{transform:scale(.5) rotate(-90deg)}to{transform:none}}
#vbar{display:none;flex:1;align-items:center;gap:12px;padding:0 4px}
.bar.rec #vbar{display:flex}.bar.rec>.nr{display:none}
#vdot{width:10px;height:10px;border-radius:50%;background:#ff3b30;animation:bob 1s infinite}
#vtm{font-variant-numeric:tabular-nums;flex:1}
#attm{position:absolute;bottom:calc(100% + 8px);left:0;border-radius:20px;padding:6px;display:flex;flex-direction:column;min-width:200px;animation:scin .2s;transform-origin:0 100%}
/* qatlamlar */
#pop,#nc,#viewer{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:20px;animation:fi .2s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.pcard{width:100%;max-width:300px;border-radius:26px;padding:8px;display:flex;flex-direction:column;background:var(--sheet);animation:scin .25s cubic-bezier(.3,1.4,.5,1)}
.prow{display:flex;justify-content:space-around;padding:6px 2px 10px;border-bottom:1px solid var(--gb);margin-bottom:4px}
.prow button{font-size:26px;background:none;border:0;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.prow button:active{transform:scale(1.5)}
#viewer{background:rgba(0,0,0,.94);padding:0;flex-direction:column}
#viewer img{max-width:100%;max-height:92%;object-fit:contain;animation:scin .3s}
#viewer .vx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;color:#fff;font-size:22px;background:rgba(255,255,255,.2);border:0;border-radius:50%;width:42px;height:42px}
#emo{position:fixed;left:0;right:0;bottom:0;z-index:20;height:44vh;border-radius:28px 28px 0 0;background:var(--sheet);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .3s cubic-bezier(.22,1,.36,1);border:1px solid var(--gb)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#emo .et{display:flex;gap:8px;padding:12px 14px 6px}
.eg{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:6px 10px 14px;align-content:start}
.eg button{background:none;border:0;font-size:26px;padding:6px 0;cursor:pointer;border-radius:12px}
.eg button img{width:34px;height:34px}
.eg button:active{background:var(--g);transform:scale(1.2)}
.ncc{width:100%;max-width:360px;border-radius:30px;padding:22px;background:var(--sheet);animation:scin .3s cubic-bezier(.3,1.4,.5,1)}
.ncc h3{margin:0 0 12px}
.ncc input{width:100%;margin-bottom:10px;padding:12px 14px;border-radius:16px;border:1px solid var(--gb);background:var(--g);color:var(--t);font:inherit;font-size:16px;outline:0}
.seg{display:flex;gap:8px;margin-bottom:10px}.seg button{flex:1}
.ics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.ics span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;border:1px solid var(--gb);cursor:pointer}
.ics span.on{background:var(--me)}
.row2{display:flex;gap:8px;margin-top:6px}.row2 button{flex:1;padding:12px;border-radius:16px;border:1px solid var(--gb);background:var(--g);cursor:pointer}
.row2 .pri{background:var(--me);color:#fff;border:0;font-weight:600}
/* video xabar va qo'ng'iroq */
#call,#rec{position:fixed;inset:0;z-index:40;background:#0b0b14;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#call.on,#rec.on{display:flex}
#rv,#rp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#lv{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:100px;height:140px;object-fit:cover;border-radius:22px;border:1px solid rgba(255,255,255,.5);z-index:2;transform:scaleX(-1);background:#222}
#info{position:relative;z-index:2;text-align:center;font-size:20px;text-shadow:0 2px 10px rgba(0,0,0,.5);padding:0 20px}
#info small{display:block;font-size:14px;opacity:.85;margin-top:6px}
#av{display:none;font-size:72px;margin-bottom:12px}
#call.voice{background:linear-gradient(160deg,#4a1d4f,#1d2a5c 55%,#0b3b4a)}
#call.voice #rv{opacity:0;width:1px;height:1px}
#call.voice #lv,#call.voice #flip,#call.voice #cam{display:none}
#call.voice #av{display:block}
#ctl,#rctl{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);z-index:2;display:flex;gap:16px;padding:12px 18px;border-radius:40px;align-items:center}
.cb{width:54px;height:54px;border-radius:50%;border:0;font-size:21px;cursor:pointer;color:#fff;background:rgba(255,255,255,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.cb.red{background:#ff3b30}.cb.grn{background:#34c759}.cb.off{background:rgba(255,255,255,.7);color:#000}
#rb{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:#ff3b30;cursor:pointer;transition:border-radius .2s,transform .2s}
#rb.on{border-radius:18px;transform:scale(.85)}
#rt{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);z-index:2;font-size:18px;background:rgba(0,0,0,.4);padding:6px 14px;border-radius:20px}
</style>
</head>

      a.ontimeupdate=()=>{const d=isFinite(a.duration)&&a.duration>0?a.duration:(m.dur||1);const p=a.currentTime/d;bars.forEach((s,i)=>s.classList.toggle('on',i/bars.length<p));tm.textContent=fmtDur(Math.max(0,Math.round(d-a.currentTime)))};

  if(m.sender===me.id&&m.body&&!m.media_path)add('✏️ Tahrirlash',()=>startEdit(m));
  if(m.sender===me.id)add('🗑 O‘chirish',()=>delMsg(m));
  p.appendChild(card);p.classList.remove('hide');
}
async function react(m,emo){const r={...(m.reactions||{})};if(r[me.id]===emo)delete r[me.id];else r[me.id]=emo;
  const {error}=await sb.from('messages').update({reactions:r}).eq('id',m.id);if(!error){m.reactions=r;const e=els.get(m.id);if(e)fill(e,m)}}
async function delMsg(m){if(!confirm('Xabarni o‘chirasizmi?'))return;
  const {error}=await sb.from('messages').update({deleted:true,body:null}).eq('id',m.id);
  if(!error){m.deleted=true;m.body=null;const e=els.get(m.id);if(e)fill(e,m);renderList()}else alert('Xato: '+error.message)}
function setReply(m){cancelEditUI();replyTo=m;$('rbt').textContent='↩ '+(m.sender===me.id?'Siz':'Yaqining');$('rbs').textContent=preview(m);$('rbar').classList.remove('hide');inp.focus()}
function clearReply(){replyTo=null;if(!editing)$('rbar').classList.add('hide')}
function startEdit(m){replyTo=null;editing=m;$('rbt').textContent='✏️ Tahrirlash';$('rbs').textContent=m.body;$('rbar').classList.remove('hide');inp.value=m.body;resize();updIcon();inp.focus()}
function cancelEditUI(){if(editing){editing=null;inp.value='';resize();updIcon()}$('rbar').classList.add('hide')}
$('rbx').onclick=()=>{replyTo=null;cancelEditUI()};

/* ---------- yozish paneli ---------- */
function resize(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'}
let icoState='';
function updIcon(){const s=(inp.value.trim()||editing)?(editing?'✓':'↑'):'🎤';if(s!==icoState){icoState=s;const b=$('send');b.textContent=s;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}}
inp.addEventListener('input',()=>{resize();updIcon()});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();sendText()}});
async function insert(o){
  const {data,error}=await sb.from('messages').insert({chat_id:cur,sender:me.id,...o}).select().single();
  if(error){st.textContent='yuborib bo‘lmadi';return false}onIns(data);return true}
async function sendText(){
  const t=inp.value.trim();if(!t)return;
  if(editing){const m=editing,nb=t.slice(0,2000);editing=null;inp.value='';resize();updIcon();$('rbar').classList.add('hide');
    if(nb!==m.body){const iso=new Date().toISOString();const {error}=await sb.from('messages').update({body:nb,edited_at:iso}).eq('id',m.id);
      if(!error){m.body=nb;m.edited_at=iso;const e=els.get(m.id);if(e)fill(e,m);renderList()}}return}
  sendSound();inp.value='';resize();const rt=replyTo;clearReply();updIcon();
  await insert({body:t.slice(0,2000),reply_to:rt?rt.id:null});
}
$('send').onclick=()=>{if(inp.value.trim()||editing)sendText();else vrStart()};
async function sendMedia(blob,type,dur){
  if(blob.size>50*1024*1024){alert('Fayl 50 MB dan kichik bo‘lishi kerak');return}
  st.textContent='yuklanmoqda…';
  const map={'video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov','audio/mp4':'m4a','audio/webm':'webm','audio/ogg':'ogg'};
  const ext=map[type]||((type.split('/')[1]||'bin').replace(/[^a-z0-9]/g,''));
  const path=me.id+'/'+Date.now()+'.'+ext;
  const {error}=await sb.storage.from('media').upload(path,blob,{contentType:type});
  if(error){st.textContent='yuklab bo‘lmadi';return}
  sendSound();const kind=type.startsWith('video')?'video':type.startsWith('audio')?'audio':'image';
  const rt=replyTo;clearReply();
  await insert({media_path:path,media_kind:kind,dur:dur||null,reply_to:rt?rt.id:null});st.textContent='onlayn';
}
$('att').onclick=e=>{e.stopPropagation();$('attm').classList.toggle('hide')};
$('a-file').onclick=()=>{$('attm').classList.add('hide');$('file').click()};
$('a-vm').onclick=()=>{$('attm').classList.add('hide');openRec()};
$('file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)sendMedia(f,f.type||'application/octet-stream')};
$('vfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)sendMedia(f,f.type||'video/mp4')};

/* emoji paneli */
function emoGrid(prem){const g=$('eg');g.textContent='';
  const add=(ch)=>{const b=document.createElement('button');if(prem){const i=document.createElement('img');i.src='https://fonts.gstatic.com/s/e/notoemoji/latest/'+PE[ch]+'/512.gif';i.alt=ch;i.loading='lazy';i.onerror=()=>{b.textContent=ch};b.appendChild(i)}else b.textContent=ch;
    b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e2=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+ch+inp.value.slice(e2);inp.selectionStart=inp.selectionEnd=s+ch.length;resize();updIcon()};g.appendChild(b)};
  (prem?Object.keys(PE):PLAIN).forEach(add)}
$('emb').onclick=()=>{const e=$('emo');if(e.classList.contains('hide')){emoGrid(true);$('e-p').classList.add('on');$('e-n').classList.remove('on');e.classList.remove('hide')}else e.classList.add('hide')};
$('e-p').onclick=()=>{emoGrid(true);$('e-p').classList.add('on');$('e-n').classList.remove('on')};
$('e-n').onclick=()=>{emoGrid(false);$('e-n').classList.add('on');$('e-p').classList.remove('on')};
list.addEventListener('click',()=>$('emo').classList.add('hide'));

/* ---------- ovozli xabar ---------- */
let vr=null,vch=[],vstart=0,vtimer=null,vstream=null,vcancel=false;
async function vrStart(){
  if(!window.MediaRecorder||!navigator.mediaDevices){alert('Bu brauzerda ovoz yozib bo‘lmaydi');return}
  try{vstream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('Mikrofonga ruxsat berilmadi');return}
  const types=['audio/mp4','audio/webm;codecs=opus','audio/webm'];const mt=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  vch=[];vcancel=false;const r=vr=new MediaRecorder(vstream,mt?{mimeType:mt}:{});
  r.ondataavailable=e=>{if(e.data&&e.data.size)vch.push(e.data)};
  r.onstop=async()=>{clearInterval(vtimer);vstream.getTracks().forEach(t=>t.stop());$('bar').classList.remove('rec');
    const type=(r.mimeType||mt||'audio/webm').split(';')[0],dur=Math.round((Date.now()-vstart)/1000),cancelled=vcancel,blob=new Blob(vch,{type});vr=null;
    if(!cancelled&&dur>=1&&blob.size>500)await sendMedia(blob,type,dur)};
  r.start();vstart=Date.now();$('vtm').textContent='0:00';$('bar').classList.add('rec');buzz(20);
  vtimer=setInterval(()=>{const s=Math.round((Date.now()-vstart)/1000);$('vtm').textContent=fmtDur(s);if(s>=300&&r.state==='recording')r.stop()},500);
}
$('vs').onclick=()=>{if(vr&&vr.state==='recording')vr.stop()};
$('vx').onclick=()=>{if(vr&&vr.state==='recording'){vcancel=true;vr.stop()}};

/* ---------- videoxabar (old/orqa kamera) ---------- */
let rs=null,rmr=null,rch=[],rtimer=null,rsec=0,rcancel=false,rfacing='user';
async function recStream(){if(rs)rs.getTracks().forEach(t=>t.stop());
  rs=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:rfacing}},audio:true});
  $('rp').srcObject=rs;$('rp').style.transform=rfacing==='user'?'scaleX(-1)':'none'}
async function openRec(){
  if(!window.MediaRecorder||!navigator.mediaDevices){$('vfile').click();return}
  try{await recStream()}catch(e){$('vfile').click();return}
  $('rt').textContent='0:00';$('rb').classList.remove('on');$('rf').style.display='';$('rec').classList.add('on');
}
function closeRec(){clearInterval(rtimer);if(rs){rs.getTracks().forEach(t=>t.stop());rs=null}$('rp').srcObject=null;$('rec').classList.remove('on')}
$('rf').onclick=async()=>{if(rmr&&rmr.state==='recording')return;rfacing=rfacing==='user'?'environment':'user';try{await recStream()}catch(e){}};
$('rb').onclick=()=>{
  if(rmr&&rmr.state==='recording'){rmr.stop();return}
  const types=['video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mt=types.find(t=>MediaRecorder.isTypeSupported(t))||'';rch=[];rcancel=false;
  const r=rmr=new MediaRecorder(rs,mt?{mimeType:mt}:{});
  r.ondataavailable=e=>{if(e.data&&e.data.size)rch.push(e.data)};
  r.onstop=async()=>{const type=(r.mimeType||mt||'video/webm').split(';')[0],cancelled=rcancel,blob=new Blob(rch,{type});closeRec();rmr=null;if(!cancelled&&blob.size>1000)await sendMedia(blob,type)};
  r.start();$('rb').classList.add('on');$('rf').style.display='none';rsec=0;
  rtimer=setInterval(()=>{rsec++;$('rt').textContent=fmtDur(rsec);if(rsec>=60&&r.state==='recording')r.stop()},1000);
};
$('rx').onclick=()=>{if(rmr&&rmr.state==='recording'){rcancel=true;rmr.stop()}else closeRec()};

/* ---------- ma'lumotlar va realtime ---------- */
function onIns(m){
  if(byId.has(m.id))return;(msgs[m.chat_id]=msgs[m.chat_id]||[]).push(m);byId.set(m.id,m);
  const mine=m.sender===me.id;
  if(cur===m.chat_id){appendBubble(m,true);if(!mine){recvSound();markRead()}}else if(!mine)recvSound();
  renderList();
}
function onUpd(n){
  const o=byId.get(n.id);if(!o)return;
  const ch=['body','deleted','reactions','edited_at','reply_to'].some(k=>JSON.stringify(o[k])!==JSON.stringify(n[k]));
  Object.assign(o,n);const el=els.get(o.id);
  if(el){if(ch)fill(el,o);else{const k=el.querySelector('.tk');if(k){k.textContent=o.read_at?'✓✓':'✓';k.classList.toggle('rd',!!o.read_at)}}}
  renderList();
}
async function markRead(){
  if(document.visibilityState!=='visible'||cur===null)return;
  const ids=(msgs[cur]||[]).filter(m=>m.sender!==me.id&&!m.read_at&&!m.deleted).map(m=>m.id);if(!ids.length)return;
  const iso=new Date().toISOString();const {error}=await sb.from('messages').update({read_at:iso}).in('id',ids);
  if(!error){ids.forEach(i=>{const m=byId.get(i);if(m)m.read_at=iso});renderList()}
}
document.addEventListener('visibilitychange',markRead);window.addEventListener('focus',markRead);

async function start(user){
  me=user;$('app').classList.remove('hide');
  const [cr,mr]=await Promise.all([sb.from('chats').select('*').order('created_at',{ascending:true}),sb.from('messages').select('*').order('created_at',{ascending:false}).limit(800)]);
  if(cr.error||mr.error){st.textContent='baza yangilanmagan';$('chats').appendChild(div('empty','Supabase’da yangi SQL hali ishga tushirilmagan.\nXabar: '+((cr.error||mr.error).message||'')));return}
  chats=cr.data;mr.data.reverse().forEach(m=>{if(m.chat_id==null)return;(msgs[m.chat_id]=msgs[m.chat_id]||[]).push(m);byId.set(m.id,m)});
  renderList();
  sb.channel('db-main')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>onIns(p.new))
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},p=>onUpd(p.new))
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'chats'},p=>chatUpsert(p.new))
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'chats'},p=>chatUpsert(p.new))
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'chats'},p=>chatRemove(p.old.id))
    .subscribe(s=>{if(s==='SUBSCRIBED')st.textContent='onlayn'});
  setupCall();
}

/* ---------- qo'ng'iroq (video va ovozli) ---------- */
const EXTRA_ICE=[];
const ICE=[{urls:'stun:stun.l.google.com:19302'},
 {urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turns:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'},...EXTRA_ICE];
function callErr(e){const n=e&&e.name;return(n==='NotAllowedError'||n==='SecurityError')?'Kamera yoki mikrofonga ruxsat berilmadi':'Xato: '+(n||'')+' '+((e&&e.message)||'')}
let ch=null,pc=null,ls=null,pend=null,tmr=null,voice=false,ringT=null,retry=null,cfacing='user';
const call=$('call'),cs=$('cs');
function show(on,txt,acc){call.classList.toggle('on',on);if(!on)call.classList.remove('voice');cs.textContent=txt||'';$('acc').style.display=acc?'block':'none'}
function ring(on){clearInterval(ringT);ringT=null;if(on){recvSound();ringT=setInterval(recvSound,2000)}}
function sig(o){return ch.send({type:'broadcast',event:'sig',payload:o})}
async function setupCall(){
  if(!navigator.mediaDevices){return}
  try{const {data}=await sb.auth.getSession();await sb.realtime.setAuth(data.session.access_token)}catch(e){}
  if(ch){try{await sb.removeChannel(ch)}catch(e){}}
  const mine=ch=sb.channel('oasis-call',{config:{private:true,broadcast:{self:false}}});
  mine.on('broadcast',{event:'sig'},m=>onSig(m.payload)).subscribe((s,err)=>{
    if(mine!==ch)return;
    if(s==='SUBSCRIBED'){$('vc').disabled=false;$('pc').disabled=false}
    else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED'){$('vc').disabled=true;$('pc').disabled=true;if(!retry)retry=setTimeout(()=>{retry=null;setupCall()},4000)}
  });
}
async function media(){if(ls)return;cfacing='user';ls=await navigator.mediaDevices.getUserMedia({audio:true,video:voice?false:{facingMode:'user'}});$('lv').srcObject=voice?null:ls;$('lv').style.transform='scaleX(-1)'}
function mk(){
  pc=new RTCPeerConnection({iceServers:ICE});ls.getTracks().forEach(t=>pc.addTrack(t,ls));
  pc.ontrack=e=>{$('rv').srcObject=e.streams[0];$('rv').play&&$('rv').play().catch(()=>{})};
  let dt=null;
  pc.oniceconnectionstatechange=()=>{if(pc&&pc.iceConnectionState!=='connected'&&pc.iceConnectionState!=='completed'&&call.classList.contains('on')&&cs.textContent.indexOf('Ulanmoqda')===0)cs.textContent='Ulanmoqda… ('+pc.iceConnectionState+')'};
  pc.onconnectionstatechange=()=>{if(!pc)return;const s=pc.connectionState;
    if(s==='connected'){clearTimeout(tmr);clearTimeout(dt);ring(false);cs.textContent=''}
    else if(s==='disconnected'){clearTimeout(dt);dt=setTimeout(()=>{if(pc&&pc.connectionState!=='connected')finish(false,'Aloqa uzildi')},7000)}
    else if(s==='failed')finish(false,'Ulanib bo‘lmadi (tarmoq to‘sqinlik qilmoqda)')};
}
const gather=()=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();
  const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(r,6000)});
async function finish(notify,msg){
  clearTimeout(tmr);ring(false);if(notify)try{await sig({t:'bye'})}catch(e){}
  if(pc){pc.close();pc=null}if(ls){ls.getTracks().forEach(t=>t.stop());ls=null}
  pend=null;$('rv').srcObject=null;$('lv').srcObject=null;
  if(msg){show(true,msg);setTimeout(()=>show(false),2500)}else show(false);
}
async function dial(v){
  if(pc)return;voice=v;call.classList.toggle('voice',v);show(true,v?'Ovozli qo‘ng‘iroq qilinmoqda…':'Video qo‘ng‘iroq qilinmoqda…');
  try{await media();mk();await pc.setLocalDescription(await pc.createOffer());await gather();
    await sig({t:'offer',sdp:pc.localDescription.sdp,voice:v});tmr=setTimeout(()=>finish(true,'Javob bermadi'),45000)}
  catch(e){finish(false,callErr(e))}
}
$('vc').onclick=()=>dial(false);$('pc').onclick=()=>dial(true);
async function onSig(d){
  if(!d)return;
  if(d.t==='offer'){if(pc)return;pend=d;voice=!!d.voice;call.classList.toggle('voice',voice);
    show(true,(voice?'Ovozli':'Video')+' qo‘ng‘iroq kelmoqda — yashil tugmani bosing',true);ring(true);tmr=setTimeout(()=>finish(false),45000)}
  else if(d.t==='answer'&&pc){await pc.setRemoteDescription({type:'answer',sdp:d.sdp});clearTimeout(tmr)}
  else if(d.t==='bye'){finish(false,'Qo‘ng‘iroq tugadi')}
}
$('acc').onclick=async()=>{
  if(!pend)return;const o=pend;pend=null;clearTimeout(tmr);ring(false);show(true,'Ulanmoqda…');
  try{await media();mk();await pc.setRemoteDescription({type:'offer',sdp:o.sdp});await pc.setLocalDescription(await pc.createAnswer());await gather();await sig({t:'answer',sdp:pc.localDescription.sdp})}
  catch(e){finish(true,callErr(e))}
};
$('end').onclick=()=>finish(true);
$('mic').onclick=e=>{if(!ls)return;const t=ls.getAudioTracks()[0];t.enabled=!t.enabled;e.currentTarget.classList.toggle('off',!t.enabled)};
$('cam').onclick=e=>{if(!ls)return;const t=ls.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;e.currentTarget.classList.toggle('off',!t.enabled)};
$('flip').onclick=async()=>{
  if(!ls||voice)return;cfacing=cfacing==='user'?'environment':'user';
  try{const ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cfacing}}});const nt=ns.getVideoTracks()[0],old=ls.getVideoTracks()[0];
    const snd=pc&&pc.getSenders().find(s=>s.track&&s.track.kind==='video');if(snd)await snd.replaceTrack(nt);
    if(old){ls.removeTrack(old);old.stop()}ls.addTrack(nt);$('lv').srcObject=ls;$('lv').style.transform=cfacing==='user'?'scaleX(-1)':'none'}catch(e){}
};

boot();
</script>
