<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--t:#1c1c1e;--s:rgba(60,60,67,.65);--g:rgba(255,255,255,.26);--gb:rgba(255,255,255,.55);--bub:rgba(255,255,255,.22);--me:linear-gradient(135deg,rgba(255,94,98,.62),rgba(139,92,246,.62));--b1:#ffd1dc;--b2:#c9b8ff;--b3:#a5e3ff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--t:#f5f5f7;--s:rgba(235,235,245,.65);--g:rgba(40,40,60,.34);--gb:rgba(255,255,255,.18);--bub:rgba(60,60,90,.3);--b1:#4a1d4f;--b2:#1d2a5c;--b3:#0b3b4a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--b1),var(--b2) 55%,var(--b3));color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;position:relative;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;display:none}
body.hasbg #bg{display:block}body.hasbg .orb{display:none}
.orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.7;z-index:0;pointer-events:none}
.o1{width:300px;height:300px;background:#ff7eb3;top:-80px;left:-80px}.o2{width:280px;height:280px;background:#7aa2ff;bottom:60px;right:-90px}.o3{width:220px;height:220px;background:#7af0d0;top:40%;left:30%;opacity:.45}
.glass{background:var(--g);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 30px rgba(0,0,0,.1)}
.hide{display:none!important}
#login{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:360px;padding:28px 22px;border-radius:32px;text-align:center}
.card .logo{width:84px;height:84px;margin-bottom:10px}
.card h1{margin:0 0 4px;font-size:30px}.card p{margin:0 0 18px;color:var(--s);font-size:14px}
.card input{width:100%;margin-bottom:10px;padding:14px 16px;border-radius:18px;border:1px solid var(--gb);background:var(--g);color:var(--t);font:inherit;font-size:16px;outline:0}
.card input::placeholder{color:var(--s)}
.card button{width:100%;padding:14px;border:0;border-radius:18px;background:var(--me);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
#err{color:#ff453a;font-size:13px;min-height:18px;margin-top:10px}
#app{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0}
header{position:relative;z-index:5;margin:10px 12px 0;padding:9px 12px;border-radius:28px;display:flex;align-items:center;gap:8px}
.logo{width:42px;height:42px;flex:none}
header .nm{flex:1;min-width:0}header b{display:block;font-size:19px}header small{color:var(--s);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--gb);background:var(--g);color:var(--t);font-size:18px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex:none;padding:0}
.ib:disabled{opacity:.4}
#menu{position:absolute;top:calc(100% + 8px);right:0;width:240px;border-radius:22px;padding:6px;display:flex;flex-direction:column}
#menu button{background:none;border:0;color:var(--t);font:inherit;font-size:15px;text-align:left;padding:12px 14px;border-radius:16px;cursor:pointer}
#menu button:active{background:var(--g)}
#list{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:7px}
.m{max-width:80%;padding:10px 17px 7px;border-radius:30px;align-self:flex-start;overflow-wrap:anywhere;background:var(--bub)}
.m.me{align-self:flex-end;background:var(--me);color:#fff;border-color:rgba(255,255,255,.4)}
.m.me .ts{color:rgba(255,255,255,.85)}
.t{white-space:pre-wrap;font-size:16px;line-height:1.3}
.m img,.m video{display:block;max-width:100%;max-height:300px;min-width:130px;min-height:90px;border-radius:20px;margin:0 -6px 5px}
.ts{font-size:11px;color:var(--s);text-align:right;margin-top:2px}
.tk{margin-left:4px;letter-spacing:-3px;font-weight:700}.tk.rd{color:#7fe3ff}
.empty{margin:auto;text-align:center;color:var(--s);font-size:15px;padding:20px}
@keyframes pop{0%{opacity:0;transform:translateY(28px) scale(.55)}60%{opacity:1;transform:translateY(-3px) scale(1.04)}100%{opacity:1;transform:none}}
.m.new{animation:pop .5s cubic-bezier(.22,1.2,.36,1) both;transform-origin:0 100%}.m.me.new{transform-origin:100% 100%}
.send,.ib,.cb{transition:transform .18s cubic-bezier(.3,1.5,.5,1),opacity .2s}
.send:active,.ib:active,.cb:active{transform:scale(.88)}
.bar{position:relative;z-index:2;margin:6px 12px 10px;padding:6px;border-radius:30px;display:flex;gap:6px;align-items:flex-end}
textarea{flex:1;border:0;background:transparent;padding:11px 8px;font:inherit;font-size:16px;color:var(--t);resize:none;max-height:120px;outline:0}
textarea::placeholder{color:var(--s)}
.send{width:40px;height:40px;border:0;border-radius:50%;background:var(--me);color:#fff;font-size:18px;cursor:pointer;flex:none}
#call,#rec{position:fixed;inset:0;z-index:10;background:#0b0b14;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#call.on,#rec.on{display:flex}
#rv,#rp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#rp{transform:scaleX(-1)}
#lv{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:100px;height:140px;object-fit:cover;border-radius:22px;border:1px solid rgba(255,255,255,.5);z-index:2;transform:scaleX(-1);background:#222}
#info{position:relative;z-index:2;text-align:center;font-size:20px;text-shadow:0 2px 10px rgba(0,0,0,.5);padding:0 20px}
#info small{display:block;font-size:14px;opacity:.85;margin-top:6px}
#av{display:none;font-size:72px;margin-bottom:12px}
#call.voice{background:linear-gradient(160deg,#4a1d4f,#1d2a5c 55%,#0b3b4a)}
#call.voice #rv{opacity:0;width:1px;height:1px}
#call.voice #lv,#call.voice #cam{display:none}
#call.voice #av{display:block}
#ctl,#rctl{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);z-index:2;display:flex;gap:18px;padding:12px 18px;border-radius:40px;align-items:center}
.cb{width:56px;height:56px;border-radius:50%;border:0;font-size:22px;cursor:pointer;color:#fff;background:rgba(255,255,255,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.cb.red{background:#ff3b30}.cb.grn{background:#34c759}.cb.off{background:rgba(255,255,255,.7);color:#000}
#rb{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:#ff3b30;cursor:pointer;transition:border-radius .2s,transform .2s}
#rb.on{border-radius:18px;transform:scale(.85)}
#rt{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);z-index:2;font-size:18px;background:rgba(0,0,0,.4);padding:6px 14px;border-radius:20px}
</style>
</head>
<body>
<div id="bg"></div>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5e62"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<symbol id="lo" viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="url(#lg)"/><path d="M32 13c-10.5 0-19 7.6-19 17 0 5 2.4 9.5 6.3 12.6L18 51l8.5-4.2c1.8.4 3.6.6 5.5.6 10.5 0 19-7.6 19-17S42.5 13 32 13z" fill="rgba(255,255,255,.28)" stroke="#fff" stroke-width="1.5"/><path d="M32 40.5s-9-5.4-9-11.6c0-3.2 2.5-5.2 4.9-5.2 1.8 0 3.3 1 4.1 2.6.8-1.6 2.3-2.6 4.1-2.6 2.4 0 4.9 2 4.9 5.2 0 6.2-9 11.6-9 11.6z" fill="#fff"/></symbol></defs></svg>

<div id="login" class="hide">
<div class="card glass">
<svg class="logo"><use href="#lo"/></svg>
<h1>Oasis</h1><p>Faqat ikkimiz uchun 💜</p>
<input id="em" type="email" placeholder="Elektron pochta" autocomplete="username">
<input id="pw" type="password" placeholder="Parol" autocomplete="current-password">
<div id="show" style="cursor:pointer;color:var(--s);font-size:13px;margin:-2px 0 12px;text-align:left">👁 Parolni ko‘rsatish</div>
<button id="go">Kirish</button>
<div id="err"></div>
</div>
</div>

<div id="app" class="hide">
<header class="glass">
<svg class="logo"><use href="#lo"/></svg>
<div class="nm"><b>Oasis</b><small id="st">ulanmoqda…</small></div>
<button class="ib" id="pc" title="Ovozli qo‘ng‘iroq" disabled>📞</button>
<button class="ib" id="vc" title="Videoqo‘ng‘iroq" disabled>📹</button>
<button class="ib" id="mn" title="Menyu">⋯</button>
<div id="menu" class="glass hide">
<button id="m-bg">🖼 Orqa fonga rasm qo‘yish</button>
<button id="m-nobg">🧽 Fonni olib tashlash</button>

</div>

<button class="ib" id="att" title="Rasm yoki video">＋</button>
<button class="ib" id="vm" title="Videoxabar">🎥</button>

</div>

</div>

<video id="rv" autoplay playsinline></video>
<video id="lv" autoplay playsinline muted></video>
<div id="info"><div id="av">💜</div><span id="who">Oasis</span><small id="cs"></small></div>
<div id="ctl" class="glass">
<button class="cb grn" id="acc" style="display:none">📞</button>
<button class="cb" id="mic">🎙️</button>
<button class="cb" id="cam">📷</button>
<button class="cb red" id="end">✕</button>
</div>
</div>

<script>
const SB_URL='https://ilhxksrrfnxoomnaleyo.supabase.co';
const SB_KEY='sb_publishable_BHVnn4xL-gpbRHYLWL7fkQ_sJFHcblM';
if(typeof supabase==='undefined'){document.addEventListener('DOMContentLoaded',()=>{document.getElementById('login').classList.remove('hide');document.getElementById('err').textContent='Kutubxona yuklanmadi. Internetni tekshirib, sahifani yangilang.'})}
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const list=$('list'),inp=$('in'),st=$('st');
let me=null,seen=new Set(),urlCache={},ticks={},unread=new Set();
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- tovush (shabnam tomchisi) ---------- */
let ac=null,master=null,soundOn=LS.get('oasis_snd')!=='off';
function actx(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C()}if(ac&&ac.state==='suspended')ac.resume();return ac}
document.addEventListener('pointerdown',actx);
function out(c){if(master)return master;const m=c.createGain(),d=c.createDelay(),fb=c.createGain();d.delayTime.value=.14;fb.gain.value=.3;m.connect(c.destination);m.connect(d);d.connect(fb);fb.connect(d);d.connect(c.destination);return master=m}
function tone(c,t,f1,f2,vol,dur){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur*.55);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(out(c));o.start(t);o.stop(t+dur+.05)}
function sendSound(){if(!soundOn)return;const c=actx();if(!c)return;const t=c.currentTime;tone(c,t,520,1000,.2,.3);tone(c,t+.07,1050,1580,.08,.32)}
function recvSound(){if(!soundOn)return;const c=actx();if(!c)return;const t=c.currentTime;tone(c,t,1320,1180,.12,.4);tone(c,t+.16,1760,1560,.08,.45)}
function updSnd(){$('m-snd').textContent='🔔 Tovush: '+(soundOn?'yoqiq':'o‘chiq')}

/* ---------- kirish ---------- */
async function boot(){
  const bg=LS.get('oasis_bg');if(bg)setBg(bg);
  const {data}=await sb.auth.getSession();
  if(data.session){start(data.session.user)}else{$('login').classList.remove('hide')}
}
async function login(){
  const err=$('err');err.textContent='';
  const email=$('em').value.trim().toLowerCase(),pass=$('pw').value;
  if(!email||!pass){err.textContent='Pochta va parolni kiriting';return}
  $('go').textContent='Kirilmoqda…';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){
      const m=error.message||'';
      if(/invalid login/i.test(m))err.textContent='Pochta yoki parol noto‘g‘ri. Parolni 👁 bilan tekshirib ko‘ring.';
      else if(/not confirmed/i.test(m))err.textContent='Pochta tasdiqlanmagan. Supabase → Authentication → Users’da “Confirm user”ni bosing.';
      else err.textContent='Xato: '+m;
    }else{$('login').classList.add('hide');start(data.user)}
  }catch(e){err.textContent='Ulanib bo‘lmadi: '+(e.message||e)}
  $('go').textContent='Kirish';
}
$('show').onclick=()=>{const p=$('pw');p.type=p.type==='password'?'text':'password'};
$('go').onclick=login;
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

/* ---------- menyu va orqa fon ---------- */
const menu=$('menu');
$('mn').onclick=e=>{e.stopPropagation();menu.classList.toggle('hide')};
document.addEventListener('click',e=>{if(!menu.contains(e.target))menu.classList.add('hide')});
$('m-out').onclick=async()=>{menu.classList.add('hide');if(confirm('Chiqasizmi?')){await sb.auth.signOut();location.reload()}};
$('m-snd').onclick=()=>{soundOn=!soundOn;LS.set('oasis_snd',soundOn?'on':'off');updSnd();if(soundOn)sendSound()};
$('m-bg').onclick=()=>{menu.classList.add('hide');$('bgf').click()};
$('m-nobg').onclick=()=>{menu.classList.add('hide');LS.del('oasis_bg');document.body.classList.remove('hasbg');$('bg').style.backgroundImage=''};
function setBg(u){$('bg').style.backgroundImage='url('+u+')';document.body.classList.add('hasbg')}
$('bgf').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{
    const k=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const u=c.toDataURL('image/jpeg',.8);URL.revokeObjectURL(url);setBg(u);LS.set('oasis_bg',u);
  };
  img.src=url;
};
updSnd();

/* ---------- xabarlar ---------- */
const fmt=t=>{try{return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){return''}};
async function mediaUrl(p){
  if(urlCache[p])return urlCache[p];
  const {data,error}=await sb.storage.from('media').createSignedUrl(p,3600);
  if(error||!data)return null;return urlCache[p]=data.signedUrl;
}
function setTick(id,read){const e=ticks[id];if(e){e.textContent=read?'✓✓':'✓';e.classList.toggle('rd',!!read)}}
function addMsg(m,anim){
  if(seen.has(m.id))return;seen.add(m.id);
  const e=list.querySelector('.empty');if(e)e.remove();
  const mine=m.sender===me.id;
  const el=document.createElement('div');
  el.className='m glass'+(mine?' me':'')+(anim?' new':'');
  if(m.media_path){
    const x=document.createElement(m.media_kind==='video'?'video':'img');
    if(m.media_kind==='video'){x.controls=true;x.playsInline=true;x.preload='metadata'}
    mediaUrl(m.media_path).then(u=>{if(u)x.src=u});el.appendChild(x);
  }
  if(m.body){const t=document.createElement('div');t.className='t';t.textContent=m.body;el.appendChild(t)}
  const s=document.createElement('div');s.className='ts';s.textContent=fmt(m.created_at);
  if(mine){const k=document.createElement('span');k.className='tk';s.appendChild(k);ticks[m.id]=k;setTick(m.id,m.read_at)}
  else if(!m.read_at)unread.add(m.id);
  el.appendChild(s);list.appendChild(el);
  list.scrollTo({top:list.scrollHeight,behavior:anim?'smooth':'auto'});
  if(anim&&!mine){recvSound();markRead()}
}
async function markRead(){
  if(document.visibilityState!=='visible'||!unread.size)return;
  const ids=[...unread];unread.clear();
  const {error}=await sb.from('messages').update({read_at:new Date().toISOString()}).in('id',ids);
  if(error)ids.forEach(i=>unread.add(i));
}
document.addEventListener('visibilitychange',markRead);window.addEventListener('focus',markRead);
async function insert(o){
  const {data,error}=await sb.from('messages').insert({sender:me.id,...o}).select().single();
  if(error){st.textContent='yuborib bo‘lmadi';return}
  addMsg(data,true);
}
async function sendText(){
  const t=inp.value.trim();if(!t)return;
  sendSound();inp.value='';inp.style.height='auto';await insert({body:t.slice(0,2000)});
}
$('send').onclick=sendText;
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'});

async function sendMedia(blob,type){
  if(blob.size>50*1024*1024){alert('Fayl 50 MB dan kichik bo‘lishi kerak');return}
  st.textContent='yuklanmoqda…';
  const map={'video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov'};
  const ext=map[type]||((type.split('/')[1]||'bin').replace(/[^a-z0-9]/g,''));
  const path=me.id+'/'+Date.now()+'.'+ext;
  const {error}=await sb.storage.from('media').upload(path,blob,{contentType:type});
  if(error){st.textContent='yuklab bo‘lmadi';return}
  sendSound();
  await insert({media_path:path,media_kind:type.startsWith('video')?'video':'image'});
  st.textContent='onlayn';
}
$('att').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)sendMedia(f,f.type||'application/octet-stream')};
$('vfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)sendMedia(f,f.type||'video/mp4')};

/* ---------- videoxabar yozish ---------- */
let rs=null,rmr=null,rch=[],rtimer=null,rsec=0,rcancel=false;
async function openRec(){
  if(!window.MediaRecorder||!navigator.mediaDevices){$('vfile').click();return}
  try{rs=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true})}catch(e){$('vfile').click();return}
  $('rp').srcObject=rs;$('rt').textContent='0:00';$('rb').classList.remove('on');$('rec').classList.add('on');
}
function closeRec(){clearInterval(rtimer);if(rs){rs.getTracks().forEach(t=>t.stop());rs=null}$('rp').srcObject=null;$('rec').classList.remove('on')}
$('vm').onclick=openRec;
$('rb').onclick=()=>{
  if(rmr&&rmr.state==='recording'){rmr.stop();return}
  const types=['video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mt=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  rch=[];rcancel=false;
  const r=rmr=new MediaRecorder(rs,mt?{mimeType:mt}:{});
  r.ondataavailable=e=>{if(e.data&&e.data.size)rch.push(e.data)};
  r.onstop=async()=>{
    const type=(r.mimeType||mt||'video/webm').split(';')[0],cancelled=rcancel,blob=new Blob(rch,{type});
    closeRec();rmr=null;
    if(!cancelled&&blob.size>1000)await sendMedia(blob,type);
  };
  r.start();$('rb').classList.add('on');rsec=0;
  rtimer=setInterval(()=>{rsec++;$('rt').textContent=Math.floor(rsec/60)+':'+String(rsec%60).padStart(2,'0');if(rsec>=60&&r.state==='recording')r.stop()},1000);
};
$('rx').onclick=()=>{if(rmr&&rmr.state==='recording'){rcancel=true;rmr.stop()}else closeRec()};

async function start(user){
  me=user;$('app').classList.remove('hide');
  const {data,error}=await sb.from('messages').select('*').order('created_at',{ascending:true}).limit(200);
  if(error){st.textContent='xato';return}
  if(!data.length){list.innerHTML='<div class="empty">Bu yerda faqat siz va yaqiningiz. Birinchi xabarni yozing 💜</div>'}
  data.forEach(m=>addMsg(m,false));
  markRead();
  sb.channel('db-messages')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>addMsg(p.new,true))
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},p=>{if(p.new&&p.new.sender===me.id)setTick(p.new.id,p.new.read_at)})
    .subscribe(s=>{if(s==='SUBSCRIBED')st.textContent='onlayn'});
  setupCall();
}

/* ---------- qo'ng'iroq (video va ovozli) ---------- */
const ICE=[{urls:'stun:stun.l.google.com:19302'}];
let ch=null,pc=null,ls=null,pend=null,tmr=null,voice=false,ringT=null,retry=null;
const call=$('call'),cs=$('cs');
function show(on,txt,acc){call.classList.toggle('on',on);if(!on)call.classList.remove('voice');cs.textContent=txt||'';$('acc').style.display=acc?'block':'none'}
function ring(on){clearInterval(ringT);ringT=null;if(on){recvSound();ringT=setInterval(recvSound,2000)}}
function sig(o){return ch.send({type:'broadcast',event:'sig',payload:o})}
async function setupCall(){
  if(!navigator.mediaDevices){st.textContent='bu brauzerda qo‘ng‘iroq yo‘q';return}
  try{const {data}=await sb.auth.getSession();await sb.realtime.setAuth(data.session.access_token)}catch(e){}
  if(ch){try{await sb.removeChannel(ch)}catch(e){}}
  const mine=ch=sb.channel('oasis-call',{config:{private:true,broadcast:{self:false}}});
  mine.on('broadcast',{event:'sig'},m=>onSig(m.payload)).subscribe((s,err)=>{
    if(mine!==ch)return;
    if(s==='SUBSCRIBED'){$('vc').disabled=false;$('pc').disabled=false}
    else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED'){
      $('vc').disabled=true;$('pc').disabled=true;
      st.textContent='qo‘ng‘iroq kanali: '+s+(err&&err.message?' — '+err.message:'');
      if(!retry)retry=setTimeout(()=>{retry=null;setupCall()},4000);
    }
  });
}
async function media(){
  if(ls)return;
  ls=await navigator.mediaDevices.getUserMedia({audio:true,video:voice?false:{facingMode:'user'}});
  $('lv').srcObject=voice?null:ls;
}
function mk(){
  pc=new RTCPeerConnection({iceServers:ICE});
  ls.getTracks().forEach(t=>pc.addTrack(t,ls));
  pc.ontrack=e=>{$('rv').srcObject=e.streams[0];$('rv').play&&$('rv').play().catch(()=>{})};
  pc.onconnectionstatechange=()=>{
    if(!pc)return;
    if(pc.connectionState==='connected'){clearTimeout(tmr);ring(false);cs.textContent=''}
    if(pc.connectionState==='failed')finish(false,'Ulanib bo‘lmadi (tarmoq to‘sqinlik qilmoqda)');
  };
}
const gather=()=>new Promise(r=>{
  if(pc.iceGatheringState==='complete')return r();
  const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};
  pc.addEventListener('icegatheringstatechange',f);setTimeout(r,4000);
});
async function finish(notify,msg){
  clearTimeout(tmr);ring(false);if(notify)try{await sig({t:'bye'})}catch(e){}
  if(pc){pc.close();pc=null}
  if(ls){ls.getTracks().forEach(t=>t.stop());ls=null}
  pend=null;$('rv').srcObject=null;$('lv').srcObject=null;
  if(msg){show(true,msg);setTimeout(()=>show(false),2500)}else show(false);
}
async function dial(v){
  if(pc)return;voice=v;call.classList.toggle('voice',v);
  show(true,v?'Ovozli qo‘ng‘iroq qilinmoqda…':'Video qo‘ng‘iroq qilinmoqda…');
  try{
    await media();mk();
    await pc.setLocalDescription(await pc.createOffer());await gather();
    await sig({t:'offer',sdp:pc.localDescription.sdp,voice:v});
    tmr=setTimeout(()=>finish(true,'Javob bermadi'),45000);
  }catch(e){finish(false,'Kamera yoki mikrofonga ruxsat berilmadi')}
}
$('vc').onclick=()=>dial(false);
$('pc').onclick=()=>dial(true);
async function onSig(d){
  if(!d)return;
  if(d.t==='offer'){
    if(pc)return;pend=d;voice=!!d.voice;call.classList.toggle('voice',voice);
    show(true,(voice?'Ovozli':'Video')+' qo‘ng‘iroq kelmoqda — yashil tugmani bosing',true);
    ring(true);tmr=setTimeout(()=>finish(false),45000);
  }else if(d.t==='answer'&&pc){
    await pc.setRemoteDescription({type:'answer',sdp:d.sdp});clearTimeout(tmr);
  }else if(d.t==='bye'){finish(false,'Qo‘ng‘iroq tugadi')}
}
$('acc').onclick=async()=>{
  if(!pend)return;const o=pend;pend=null;clearTimeout(tmr);ring(false);show(true,'Ulanmoqda…');
  try{
    await media();mk();
    await pc.setRemoteDescription({type:'offer',sdp:o.sdp});
    await pc.setLocalDescription(await pc.createAnswer());await gather();
    await sig({t:'answer',sdp:pc.localDescription.sdp});
  }catch(e){finish(true,'Kamera yoki mikrofonga ruxsat berilmadi')}
};
$('end').onclick=()=>finish(true);
$('mic').onclick=e=>{if(!ls)return;const t=ls.getAudioTracks()[0];t.enabled=!t.enabled;e.currentTarget.classList.toggle('off',!t.enabled)};
$('cam').onclick=e=>{if(!ls)return;const t=ls.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;e.currentTarget.classList.toggle('off',!t.enabled)};

boot();
</script>
